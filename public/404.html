<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 - 群号</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site">
    <a class="logo" href="/">群<span>号</span></a>
    <nav>
      <a href="/login">登录</a>
      <a class="primary" href="/register">免费注册</a>
    </nav>
  </header>

  <main class="page narrow">
    <div class="card" style="text-align:center">
      <h2 class="title">页面不存在</h2>
      <p style="color:var(--muted);font-size:14px;line-height:1.8">
        群号是一个永久不变的 5 位数字群链接。<br>
        输入群号即可直达群聊。
      </p>

      <form class="search-box" id="searchForm" style="margin-top:24px">
        <input type="text" id="searchInput" maxlength="10"
               placeholder="输入群号" autocomplete="off" aria-label="群号">
        <button type="submit">前往</button>
      </form>
      <p class="msg error" id="searchMsg" style="text-align:center"></p>

      <a class="btn block" href="/" style="margin-top:8px">返回首页</a>
    </div>
  </main>

  <footer class="site">qunhao.net · 基于 Cloudflare 全球网络</footer>

  <script>
    document.getElementById('searchForm').onsubmit = (e) => {
      e.preventDefault();
      const v = document.getElementById('searchInput').value.trim();
      if (/^[1-9]\d{4}$/.test(v) || /^[a-zA-Z0-9]{3,10}$/.test(v)) {
        location.href = '/' + v;
      } else {
        document.getElementById('searchMsg').textContent = '群号为 5 位数字或 3-10 位字母数字';
      }
    };
    document.getElementById('searchInput').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^a-zA-Z0-9]/g, '').slice(0, 10);
      document.getElementById('searchMsg').textContent = '';
    });
  </script>
</body>
</html>
