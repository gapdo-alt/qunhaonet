<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>控制台 - 群号</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site">
    <a class="logo" href="/">群<span>号</span></a>
    <nav><a href="#" id="logoutBtn">退出登录</a></nav>
  </header>

  <main class="page narrow">
    <div class="card">
      <h2 class="title">我的群号</h2>
      <p class="dash-code" id="codeDisplay">--------</p>

      <label>展示页链接（推荐分享给群成员）</label>
      <div class="link-row">
        <span class="url" id="pageUrl">…</span>
        <button type="button" data-copy="pageUrl">复制</button>
      </div>

      <label>图片直链（可嵌入论坛 / 博客 / 文档）</label>
      <div class="link-row">
        <span class="url" id="imageUrl">…</span>
        <button type="button" data-copy="imageUrl">复制</button>
      </div>

      <div class="preview-box" id="previewBox">
        <div class="empty">暂无二维码</div>
      </div>

      <div class="upload-row">
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp">
        <button type="button" id="uploadBtn">上传 / 替换二维码</button>
      </div>
      <p class="meta-line" id="metaLine"></p>
      <p class="msg" id="msg" style="text-align:center"></p>
    </div>
  </main>

  <script>
    let meta = null;

    function setMsg(text, ok) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'error');
    }

    function render() {
      document.getElementById('codeDisplay').textContent = meta.code;
      document.getElementById('pageUrl').textContent = meta.pageUrl;
      document.getElementById('imageUrl').textContent = meta.imageUrl;

      const box = document.getElementById('previewBox');
      if (meta.hasImage) {
        box.innerHTML = '<img alt="二维码预览" src="/i/' + meta.code + '?v=' + meta.updatedAt + '">';
        document.getElementById('metaLine').textContent =
          '最后更新：' + new Date(meta.updatedAt).toLocaleString('zh-CN');
      } else {
        box.innerHTML = '<div class="empty">暂无二维码</div>';
        document.getElementById('metaLine').textContent = '上传二维码后，链接立即生效';
      }
    }

    async function loadMeta() {
      const res = await fetch('/api/qr/meta');
      if (res.status === 401) { location.href = '/login'; return; }
      meta = await res.json();
      render();
    }

    document.querySelectorAll('[data-copy]').forEach((btn) => {
      btn.onclick = async () => {
        const text = document.getElementById(btn.dataset.copy).textContent;
        await navigator.clipboard.writeText(text);
        const old = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(() => (btn.textContent = old), 1200);
      };
    });

    document.getElementById('uploadBtn').onclick = async () => {
      const input = document.getElementById('fileInput');
      const file = input.files && input.files[0];
      if (!file) { setMsg('请先选择图片文件', false); return; }
      if (file.size > 2 * 1024 * 1024) { setMsg('文件不能超过 2MB', false); return; }

      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      setMsg('上传中…', true);
      try {
        const form = new FormData();
        form.append('file', file);
        const res = await fetch('/api/qr/upload', { method: 'POST', body: form });
        const data = await res.json();
        if (res.ok) {
          setMsg('上传成功，所有链接已更新', true);
          input.value = '';
          await loadMeta();
        } else {
          setMsg(data.error || '上传失败', false);
        }
      } catch {
        setMsg('网络错误，请重试', false);
      } finally {
        btn.disabled = false;
      }
    };

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/';
    };

    loadMeta();
  </script>
</body>
</html>
