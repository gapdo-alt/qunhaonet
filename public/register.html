<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 - 群号</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site">
    <a class="logo" href="/">群<span>号</span></a>
    <nav><a href="/login">登录</a></nav>
  </header>

  <main class="page narrow">
    <div class="card">
      <h2 class="title">注册账号</h2>
      <p style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px">
        注册后可在控制台创建最多 5 个群号
      </p>

      <form id="registerForm">
        <label for="email">邮箱</label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="password">密码（至少 8 位）</label>
        <input type="password" id="password" autocomplete="new-password" minlength="8" required>

        <!-- Turnstile（可选）：填写 sitekey 后自动启用 -->
        <div id="turnstileBox" style="margin-top:16px"></div>

        <button type="submit" class="block" id="submitBtn">注册</button>
      </form>

      <p class="msg" id="msg"></p>
    </div>
    <p class="foot-link">已有账号？<a href="/login">去登录</a></p>
  </main>

  <script>
    // 如启用 Turnstile：填入你的 sitekey（详见 README）
    const TURNSTILE_SITE_KEY = '';

    function setMsg(text, ok) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'error');
    }

    document.getElementById('registerForm').onsubmit = async (e) => {
      e.preventDefault();
      const body = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      };
      if (TURNSTILE_SITE_KEY && window.turnstile) {
        body.turnstileToken = window.turnstile.getResponse();
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          location.href = '/dashboard';
        } else {
          setMsg(data.error || '注册失败', false);
        }
      } catch {
        setMsg('网络错误，请重试', false);
      } finally {
        btn.disabled = false;
      }
    };

    if (TURNSTILE_SITE_KEY) {
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
      s.async = true;
      s.onload = () => window.turnstile.render('#turnstileBox', { sitekey: TURNSTILE_SITE_KEY });
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
