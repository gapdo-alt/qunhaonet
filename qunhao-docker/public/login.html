<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 群号</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css?v=20260612">
</head>
<body>
  <header class="site">
    <a class="logo" href="/">群<span>号</span></a>
    <nav><a href="/register">注册</a></nav>
  </header>

  <main class="page narrow">
    <div class="card">
      <h2 class="title">登录</h2>
      <form id="loginForm">
        <label for="email">邮箱</label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="password">密码</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <button type="submit" class="block" id="submitBtn">登录</button>
      </form>
      <p class="msg" id="msg"></p>
      <p style="text-align:center;margin-top:12px;font-size:13px">
        <a href="/forgot-password">忘记密码？</a>
      </p>
    </div>
    <p class="foot-link">还没有账号？<a href="/register">免费注册</a></p>
  </main>

  <script>
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      msg.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) {
          location.href = '/dashboard';
        } else {
          const data = await res.json();
          msg.textContent = data.error || '登录失败';
          msg.className = 'msg error';
        }
      } catch {
        msg.textContent = '网络错误，请重试';
        msg.className = 'msg error';
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
