<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>控制台 - 群号</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css?v=20260612">
</head>
<body>
  <header class="site">
    <a class="logo" href="/">群<span>号</span></a>
    <nav>
      <a href="/admin" id="adminLink" hidden>用户管理</a>
      <a href="#profile">群主资料</a>
      <a href="#" id="logoutBtn">退出登录</a>
    </nav>
  </header>

  <main class="page" style="max-width:640px">

    <div class="section-head">
      <h2>我的群号 <span id="countLabel" style="color:var(--muted);font-size:14px"></span></h2>
      <button type="button" id="newCodeBtn">+ 新建群号</button>
    </div>

    <div class="create-panel" id="createPanel" hidden>
      <div id="customBlock" hidden>
        <label>高级会员：自定义群号（3-10 位字母或数字，大小写将被保留，重名按不区分大小写判定）</label>
        <div class="custom-code-row">
          <input type="text" id="customCode" maxlength="10" placeholder="例如：HDRClub" autocomplete="off">
          <button type="button" class="btn ghost" id="checkCustomBtn">查可用</button>
        </div>
        <p class="msg" id="customMsg"></p>
        <p style="font-size:13px;color:var(--muted);margin:8px 0 16px">留空则使用下方随机数字群号</p>
      </div>

      <label>从 8 个数字中选一个（选定后不可更改）</label>
      <div class="candidates" id="candidates"></div>
      <button type="button" class="refresh-link" id="refreshCandBtn">换一批</button>

      <label for="groupName">群名称（显示在群页面上，创建后不可修改）</label>
      <input type="text" id="groupName" maxlength="30" placeholder="例如：HDR 技术交流群"
             style="width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);outline:none">

      <div style="display:flex;gap:10px;margin-top:20px">
        <button type="button" id="createBtn">创建</button>
        <button type="button" class="btn ghost" id="cancelCreateBtn">取消</button>
      </div>
      <p class="msg" id="createMsg"></p>
    </div>

    <div id="codeList"></div>
    <p class="status-legend">
      二维码状态：<span class="dot green"></span>3 天内更新
      <span class="dot yellow"></span>3-5 天
      <span class="dot red"></span>超过 5 天
      <span class="dot none"></span>未上传
    </p>

    <div class="card" id="profile" style="margin-top:32px">
      <h2 class="title" style="text-align:left;font-size:18px">群主资料</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:4px">
        群二维码失效时，访客可通过「联系群主」看到以下信息
      </p>
      <div class="profile-grid" style="margin-top:14px">
        <div class="field">
          <label for="wechatId">微信号</label>
          <input type="text" id="wechatId" maxlength="50" placeholder="选填">
        </div>
        <button type="button" id="saveProfileBtn">保存</button>
      </div>
      <div class="profile-grid" style="margin-top:18px">
        <div class="field">
          <label>微信二维码</label>
          <img class="wechat-qr-thumb" id="wechatQrThumb" alt="" hidden>
          <span id="wechatQrEmpty" style="font-size:13px;color:var(--muted)">未上传</span>
        </div>
        <button type="button" id="wechatQrBtn">上传 / 替换</button>
        <input type="file" id="wechatQrInput" accept="image/png,image/jpeg,image/webp" hidden>
      </div>
      <p class="msg" id="profileMsg"></p>
    </div>

    <div class="card" id="passwordCard" style="margin-top:24px">
      <h2 class="title" style="text-align:left;font-size:18px">修改密码</h2>
      <div class="field" style="margin-top:14px">
        <label for="currentPassword">当前密码</label>
        <input type="password" id="currentPassword" autocomplete="current-password">
      </div>
      <div class="field" style="margin-top:12px">
        <label for="newPassword">新密码（至少 8 位）</label>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="8">
      </div>
      <button type="button" id="changePasswordBtn" style="margin-top:16px">更新密码</button>
      <p class="msg" id="passwordMsg"></p>
    </div>

  </main>

  <input type="file" id="qrFileInput" accept="image/*" hidden>

  <script src="/assets/vendor/jsQR.js"></script>
  <script src="/assets/vendor/qrcode.js"></script>
  <script src="/assets/qr-tools.js"></script>
  <script>
    let state = { codes: [], max: 5, host: location.host, canCustomize: false, role: 'user' };
    let uploadTarget = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    async function readJson(res) {
      const text = await res.text();
      try { return JSON.parse(text); }
      catch { return { error: text || ('HTTP ' + res.status) }; }
    }

    const STATUS_TEXT = { green: '近期已更新', yellow: '建议更新', red: '可能已过期', none: '未上传二维码' };

    function rowHtml(c) {
      return `
        <a class="code-row" href="/dashboard/${c.code}">
          <span class="dot ${c.statusLevel}" title="${STATUS_TEXT[c.statusLevel]}"></span>
          <span class="rname">${esc(c.name)}</span>
          <span class="rcode">${esc(c.code)}</span>
          <span class="rstatus ${c.statusLevel}">${STATUS_TEXT[c.statusLevel]}</span>
          <span class="ractions">
            <button type="button" onclick="pickUpload(event, '${esc(c.code)}')">更新</button>
            <button type="button" class="danger" onclick="delCode(event, '${esc(c.code)}', '${esc(c.name)}')">删除</button>
          </span>
          <span class="rmsg msg" id="msg-${esc(c.code)}"></span>
        </a>`;
    }

    function renderCodes() {
      $('countLabel').textContent = `（${state.codes.length}/${state.max}）`;
      $('newCodeBtn').style.display = state.codes.length >= state.max ? 'none' : '';

      const list = $('codeList');
      if (!state.codes.length) {
        list.innerHTML = '<div class="card" style="text-align:center;color:var(--muted)">还没有群号，点击右上角「新建群号」开始</div>';
        return;
      }
      list.innerHTML = state.codes.map(rowHtml).join('');
    }

    function setRowMsg(code, text, ok) {
      const el = $('msg-' + code);
      if (el) { el.textContent = text; el.className = 'rmsg msg ' + (ok ? 'ok' : 'error'); }
    }

    async function loadCodes() {
      const res = await fetch('/api/codes');
      if (res.status === 401) { location.href = '/login'; return; }
      const data = await res.json();
      state.codes = data.codes;
      state.max = data.max;
      state.host = data.host;
      state.canCustomize = !!data.canCustomize;
      state.role = data.role || 'user';
      $('adminLink').hidden = state.role !== 'admin';
      renderCodes();
    }

    /* ===== 列表内单步更新：点「更新」→ 选图 → 自动解析并上传 ===== */
    function pickUpload(ev, code) {
      ev.preventDefault(); ev.stopPropagation();
      uploadTarget = code;
      $('qrFileInput').value = '';
      $('qrFileInput').click();
    }

    $('qrFileInput').addEventListener('change', async () => {
      const file = $('qrFileInput').files[0];
      const code = uploadTarget;
      if (!file || !code) return;

      setRowMsg(code, '正在识别二维码…', true);
      try {
        const content = await QrTools.decodeQrFromFile(file);
        if (!content) { setRowMsg(code, '未能识别图片中的二维码，请换一张更清晰的图', false); return; }

        const platform = QrTools.detectPlatform(content);
        if (!platform) { setRowMsg(code, '仅支持微信群或飞书群二维码', false); return; }

        setRowMsg(code, '识别成功，正在上传…', true);
        const png = await QrTools.renderQrPng(content, platform);

        const form = new FormData();
        form.append('groupUrl', content);
        form.append('file', png, 'qr-c.png');
        const res = await fetch('/api/codes/' + encodeURIComponent(code) + '/upload', { method: 'POST', body: form });
        const data = await readJson(res);
        if (res.ok) {
          await loadCodes();
          setRowMsg(code, '已更新', true);
        } else {
          setRowMsg(code, data.error || '上传失败', false);
        }
      } catch (e) {
        setRowMsg(code, (e && e.message) || '处理失败，请重试', false);
      }
    });

    /* ===== 删除 ===== */
    async function delCode(ev, code, name) {
      ev.preventDefault(); ev.stopPropagation();
      if (!confirm(`确定删除群号 ${code}（${name}）？\n所有分享链接将立即失效，且不可恢复。`)) return;
      const res = await fetch('/api/codes/' + encodeURIComponent(code), { method: 'DELETE' });
      if (res.ok) {
        await loadCodes();
      } else {
        const data = await readJson(res);
        setRowMsg(code, data.error || '删除失败', false);
      }
    }

    /* ===== 新建群号 ===== */
    let candidateToken = '';
    let selectedCode = '';

    async function loadCandidates() {
      const box = $('candidates');
      box.innerHTML = '<button type="button" class="code-opt" disabled>加载中…</button>';
      selectedCode = '';
      const res = await fetch('/api/codes/candidates');
      if (res.status === 401) { location.href = '/login'; return; }
      const data = await res.json();
      candidateToken = data.token;
      state.host = data.host;
      box.innerHTML = '';
      for (const code of data.codes) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'code-opt';
        btn.textContent = code;
        btn.onclick = () => {
          box.querySelectorAll('.code-opt').forEach((b) => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedCode = code;
          $('customCode').value = '';
          $('customMsg').textContent = '';
        };
        box.appendChild(btn);
      }
    }

    $('newCodeBtn').onclick = () => {
      $('createPanel').hidden = false;
      $('newCodeBtn').disabled = true;
      $('customBlock').hidden = !state.canCustomize;
      loadCandidates();
    };
    $('cancelCreateBtn').onclick = () => {
      $('createPanel').hidden = true;
      $('newCodeBtn').disabled = false;
    };
    $('refreshCandBtn').onclick = loadCandidates;

    /* 自定义码可用性检查（高级会员） */
    $('checkCustomBtn').onclick = async () => {
      const code = $('customCode').value.trim();
      const msg = $('customMsg');
      if (!/^[a-zA-Z0-9]{3,10}$/.test(code)) {
        msg.textContent = '需 3-10 位字母或数字';
        msg.className = 'msg error';
        return;
      }
      const res = await fetch('/api/codes/check?code=' + encodeURIComponent(code));
      const data = await readJson(res);
      if (res.ok && data.available) {
        msg.textContent = code + ' 可用';
        msg.className = 'msg ok';
      } else {
        msg.textContent = data.reason || data.error || '不可用';
        msg.className = 'msg error';
      }
    };
    $('customCode').addEventListener('input', () => {
      if ($('customCode').value.trim()) selectedCode = '';
      document.querySelectorAll('#candidates .code-opt').forEach((b) => b.classList.remove('selected'));
      $('customMsg').textContent = '';
    });

    $('createBtn').onclick = async () => {
      const msg = $('createMsg');
      const name = $('groupName').value.trim();
      const customCode = state.canCustomize ? $('customCode').value.trim() : '';
      msg.textContent = '';
      if (!customCode && !selectedCode) { msg.textContent = '请先选择一个群号或填写自定义群号'; msg.className = 'msg error'; return; }
      if (!name) { msg.textContent = '请填写群名称'; msg.className = 'msg error'; return; }

      const finalCode = customCode || selectedCode;
      $('createBtn').disabled = true;
      try {
        // 浏览器渲染永久二维码 A（内容为展示页链接，与群号互锁）
        const pngA = await QrTools.renderQrPng('https://' + state.host + '/' + finalCode, 'qunhao');
        const form = new FormData();
        if (customCode) {
          form.append('customCode', customCode);
        } else {
          form.append('code', selectedCode);
          form.append('token', candidateToken);
        }
        form.append('name', name);
        form.append('file', pngA, 'qr-a.png');

        const res = await fetch('/api/codes', { method: 'POST', body: form });
        const data = await readJson(res);
        if (res.ok) {
          // 创建成功 → 进入详情页继续上传群二维码
          location.href = '/dashboard/' + encodeURIComponent(data.code);
        } else {
          msg.textContent = data.error || '创建失败';
          msg.className = 'msg error';
          if (!customCode && (res.status === 409 || res.status === 410)) loadCandidates();
        }
      } catch (e) {
        msg.textContent = (e && e.message) || '网络错误，请重试';
        msg.className = 'msg error';
      } finally {
        $('createBtn').disabled = false;
      }
    };

    /* ===== 群主资料 ===== */
    function setProfileMsg(text, ok) {
      const el = $('profileMsg');
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'error');
    }

    async function loadProfile() {
      const res = await fetch('/api/profile');
      if (!res.ok) return;
      const data = await res.json();
      $('wechatId').value = data.wechatId || '';
      if (data.hasWechatQr) {
        $('wechatQrThumb').src = '/api/profile/wechat-qr?v=' + Date.now();
        $('wechatQrThumb').hidden = false;
        $('wechatQrEmpty').hidden = true;
      }
    }

    $('saveProfileBtn').onclick = async () => {
      const res = await fetch('/api/profile', {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ wechatId: $('wechatId').value }),
      });
      setProfileMsg(res.ok ? '已保存' : '保存失败', res.ok);
    };

    $('wechatQrBtn').onclick = () => { $('wechatQrInput').value = ''; $('wechatQrInput').click(); };
    $('wechatQrInput').addEventListener('change', async () => {
      const file = $('wechatQrInput').files[0];
      if (!file) return;
      setProfileMsg('上传中…', true);
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('/api/profile/wechat-qr', { method: 'POST', body: form });
      if (res.ok) {
        setProfileMsg('已上传', true);
        $('wechatQrThumb').src = '/api/profile/wechat-qr?v=' + Date.now();
        $('wechatQrThumb').hidden = false;
        $('wechatQrEmpty').hidden = true;
      } else {
        const data = await res.json().catch(() => ({}));
        setProfileMsg(data.error || '上传失败', false);
      }
    });

    $('changePasswordBtn').onclick = async () => {
      const msg = $('passwordMsg');
      const res = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          currentPassword: $('currentPassword').value,
          newPassword: $('newPassword').value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        msg.textContent = '密码已更新';
        msg.className = 'msg ok';
        $('currentPassword').value = '';
        $('newPassword').value = '';
      } else {
        msg.textContent = data.error || '更新失败';
        msg.className = 'msg error';
      }
    };

    $('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/';
    };

    loadCodes();
    loadProfile();
  </script>
</body>
</html>
