<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>忘记密码 - 群号</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css?v=20260612">
</head>
<body>
  <header class="site">
    <a class="logo" href="/">群<span>号</span></a>
    <nav><a href="/login">登录</a></nav>
  </header>

  <main class="page narrow">
    <div class="card">
      <h2 class="title">忘记密码</h2>
      <p style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px">
        输入注册邮箱，我们将发送重置链接
      </p>
      <form id="form">
        <label for="email">邮箱</label>
        <input type="email" id="email" autocomplete="email" required>
        <button type="submit" class="block" id="submitBtn">发送重置邮件</button>
      </form>
      <p class="msg" id="msg"></p>
    </div>
    <p class="foot-link"><a href="/login">← 返回登录</a></p>
  </main>

  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      msg.textContent = '';
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value }),
        });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = data.message || '邮件已发送，请查收';
          msg.className = 'msg ok';
        } else {
          msg.textContent = data.error || '发送失败';
          msg.className = 'msg error';
        }
      } catch {
        msg.textContent = '网络错误，请重试';
        msg.className = 'msg error';
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
