<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置密码 - 群号</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css?v=20260612">
</head>
<body>
  <header class="site">
    <a class="logo" href="/">群<span>号</span></a>
    <nav><a href="/login">登录</a></nav>
  </header>

  <main class="page narrow">
    <div class="card">
      <h2 class="title">设置新密码</h2>
      <form id="form">
        <label for="password">新密码（至少 8 位）</label>
        <input type="password" id="password" autocomplete="new-password" minlength="8" required>

        <label for="password2">确认新密码</label>
        <input type="password" id="password2" autocomplete="new-password" minlength="8" required>

        <button type="submit" class="block" id="submitBtn">重置密码</button>
      </form>
      <p class="msg" id="msg"></p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('msg').textContent = '链接无效，请重新申请重置';
      document.getElementById('msg').className = 'msg error';
      document.getElementById('submitBtn').disabled = true;
    }

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password').value;
      const pwd2 = document.getElementById('password2').value;
      const msg = document.getElementById('msg');
      if (pwd !== pwd2) {
        msg.textContent = '两次密码不一致';
        msg.className = 'msg error';
        return;
      }
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token, password: pwd }),
        });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = '密码已重置，正在跳转登录…';
          msg.className = 'msg ok';
          setTimeout(() => { location.href = '/login'; }, 1500);
        } else {
          msg.textContent = data.error || '重置失败';
          msg.className = 'msg error';
          btn.disabled = false;
        }
      } catch {
        msg.textContent = '网络错误，请重试';
        msg.className = 'msg error';
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
